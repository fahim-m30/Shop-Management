name: Keep Render Backend Alive 24/7

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 min inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Service
        run: |
          echo "Sending keep-alive ping to Render backend..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://shop-management-jj6y.onrender.com/api/health)
          echo "Ping response HTTP status: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "✅ Backend is alive and active!"
          else
            echo "⚠️ Backend response was $RESPONSE, retrying once..."
            sleep 5
            curl -s https://shop-management-jj6y.onrender.com/api/health
          fi
