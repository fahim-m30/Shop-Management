<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="দোকান ম্যানেজমেন্ট সিস্টেম - বিক্রয়, মাল ও আয়ের হিসাব" />
    
    <!-- PWA Manifest for Android & Chrome -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Apple iOS Safari Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="দোকান ম্যানেজার" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/icon-512.png" />

    <title>দোকান ম্যানেজার</title>
  </head>
  <body>
    <noscript>আপনার ব্রাউজারে JavaScript চালু করুন।</noscript>
    <div id="root"></div>

    <script>
      // Register minimal service worker for PWA install criteria and auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
